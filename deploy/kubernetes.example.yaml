apiVersion: v1
kind: ConfigMap
metadata:
  name: alert-analyzer-config
  namespace: holmes
data:
  MYSQL_HOST: mysql-0.mysql.mysql.svc.cluster.local
  MYSQL_PORT: "3306"
  HOLMES_API_URL: http://holmesgpt-holmes.default.svc.cluster.local
  ALERT_RULES_FILE: /app/config/alert_rules.yaml
  WORKER_POLL_SECONDS: "2"
  TASK_LEASE_SECONDS: "1200"
  ANALYSIS_MAX_AGE_SECONDS: "1800"
  RETRY_DELAYS_SECONDS: 60,180,600
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alert-analyzer-rules
  namespace: holmes
data:
  alert_rules.yaml: |
    rules:
      - match:
          alertname: PodCPUUsageHigh
          severity: warning
        guidance: >-
          Investigate only the alerted Pod identified by namespace and pod labels.
          Confirm the Pod exists and identify its owning workload. Inspect its CPU
          request/limit, recent CPU usage and throttling around the alert start,
          recent restarts, and relevant recent Pod logs. Use at most 6 read-only
          tool calls, then stop. Do not inspect unrelated Pods, ingress, networking,
          HPA, control-plane, or cluster-wide history. State unavailable evidence
          explicitly; when evidence is insufficient, give only read-only follow-up.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: holmes
  namespace: holmes
spec:
  # Keep one worker replica in the first version; task processing is serialized.
  replicas: 1
  selector:
    matchLabels:
      app: holmes
  template:
    metadata:
      labels:
        app: holmes
    spec:
      containers:
        - name: alert-analyzer
          image: hb.reg.com/project/holmes-agent:<tag>
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: alert-analyzer-config
          env:
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: alert-analyzer-secrets
                  key: mysql-database
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: alert-analyzer-secrets
                  key: mysql-user
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: alert-analyzer-secrets
                  key: mysql-password
            - name: FEISHU_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: alert-analyzer-secrets
                  key: feishu-webhook-url
                  optional: true
            - name: FEISHU_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: alert-analyzer-secrets
                  key: feishu-signing-secret
                  optional: true
            - name: HOLMES_API_KEY
              valueFrom:
                secretKeyRef:
                  name: alert-analyzer-secrets
                  key: holmes-api-key
                  optional: true
          volumeMounts:
            - name: alert-rules
              mountPath: /app/config/alert_rules.yaml
              subPath: alert_rules.yaml
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: alert-rules
          configMap:
            name: alert-analyzer-rules
            items:
              - key: alert_rules.yaml
                path: alert_rules.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: holmes
  namespace: holmes
spec:
  selector:
    app: holmes
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
