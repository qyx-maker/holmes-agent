variables:
  HARBOR_REGISTRY: hb.reg.com
  IMAGE_NAME: hb.reg.com/project/$CI_PROJECT_NAME

stages:
  - build

build_image:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - printf '%s' "$HARBOR_PASSWORD" | docker login "$HARBOR_REGISTRY" --username "$HARBOR_USER" --password-stdin Harbor12345
    - docker build -t "$IMAGE_NAME:$CI_COMMIT_TAG" .
    - docker push "$IMAGE_NAME:$CI_COMMIT_TAG"
    - docker rmi "$IMAGE_NAME:$CI_COMMIT_TAG"
